name: trajectory-explore
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      # GPU-capable torch: PyPI ships CUDA-enabled wheels on Linux x86_64, so the
      # GPU server uses CUDA automatically (utils.device.get_device → cuda→mps→cpu).
      # CPU-only machines (e.g. the local coding PC) still work — get_device falls
      # back to CPU at runtime; the CUDA libs simply go unused.
      #   • Force a specific CUDA build:  --index-url https://download.pytorch.org/whl/cu124
      #   • Force CPU-only (smaller):     --index-url https://download.pytorch.org/whl/cpu
      - torch
      - torchvision
      - diffusers
      - gymnasium
      - pygame
      - numpy
      - scipy
      - zarr
      - einops
      - matplotlib
      - wandb
      - tensorboard
      - pytest
