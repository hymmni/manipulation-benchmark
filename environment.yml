name: trajectory-explore
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      # CPU-only torch (local coding PC has no GPU). PyTorch CPU wheel index is the
      # primary index so torch/torchvision resolve to +cpu builds; PyPI is the
      # fallback for every other package.
      - --index-url https://download.pytorch.org/whl/cpu
      - --extra-index-url https://pypi.org/simple
      - torch
      - torchvision
      - diffusers
      - gymnasium
      - pygame
      - numpy
      - scipy
      - zarr
      - einops
      - matplotlib
      - wandb
      - tensorboard
      - pytest
